name: bojohelp_app
description: 보조출연 헬프 — 출연자 앱(Android) + 웹(PWA, iPhone)
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.8.0        # Material 위젯(3.47 부터 별도 패키지)
  cupertino_ui: ^1.1.4
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3       # 지도 열기·전화 걸기(REQ-PC18)
  intl: ^0.20.3
  # 기능 구현 단계에서 추가(버전은 pub.dev 확인 후): image_picker, camera, signature, qr_flutter,
  #   firebase_messaging(FCM 설정 후), mobile_scanner(현장 반장 모드)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
