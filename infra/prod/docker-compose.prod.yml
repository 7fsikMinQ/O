# 운영(Lightsail 서울 단일 서버). 외부에 여는 포트: caddy 80/443 뿐(또는 cloudflared 터널 사용 시 0개). DB·백엔드는 내부망 전용. 18번 문서.
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_SUPERUSER:?}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: app
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
      - pglog:/var/log/postgresql     # SQL 로그 파일(일별 회전, 보존 정리는 18번 §8)
      - ../db/init-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    # 모든 SQL 기록. 바인드 값(주민번호·토큰·계좌)은 로그에 남기지 않는다(log_parameter_max_length=0)
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=50
      - -c
      - log_statement=all
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - logging_collector=on
      - -c
      - log_directory=/var/log/postgresql
      - -c
      - log_filename=pg-%Y-%m-%d.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=0
      - -c
      - log_line_prefix=%m [%p] %u@%d %a %h 
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
    networks: [internal]            # ports 없음 = 호스트에 공개되지 않음
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d app"]
      interval: 10s
      retries: 10
  backend:
    image: ${BACKEND_IMAGE:?}        # 예: bojohelp-backend:20261028-abc1234
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/app
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
    env_file: [../../.env.prod]      # 서버에만 존재, 저장소에 없음(권한 600)
    networks: [internal, edge]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]     # 터널 방식이면 이 줄을 지우고 cloudflared 서비스를 사용
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge]
networks:
  internal: {internal: true}
  edge: {}
volumes:
  pgdata:
  pglog:
  caddy_data:
