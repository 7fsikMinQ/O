# 로컬 개발용 인프라 (운영과 무관). 사용: docker compose -f infra/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
      POSTGRES_DB: ${DB_NAME:-app}
      TZ: UTC
    ports: ["127.0.0.1:${DB_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-app}"]
      interval: 5s
      timeout: 3s
      retries: 10
  # 파일 저장소: MinIO 는 2026-04 보관(유지보수 중단, 21번 §1-10)되어 넣지 않는다.
  # 파일 기능(P1 후반)을 만들 때 Cloudflare R2 개발 버킷(무료 10GB)을 쓰거나 Garage/SeaweedFS 를 검증해 추가한다.
  mailpit:                     # 메일 수신함(발송 테스트)
    image: axllent/mailpit
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  # valkey:                    # P2: rate limit / OTP 캐시가 필요해질 때 활성화
  #   image: valkey/valkey:8
  #   ports: ["6379:6379"]
volumes:
  pgdata:
