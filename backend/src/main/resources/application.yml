spring:
  mail:
    host: ${SMTP_HOST:localhost}      # 개발: docker compose 의 Mailpit (수신함 http://localhost:8025)
    port: ${SMTP_PORT:1025}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: bojohelp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}      # 운영은 application-prod.yml 이 기본값 없이 덮어써 누락 시 기동 실패
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # 스키마는 Flyway 만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
app:
  web-base-url: ${WEB_BASE_URL:http://localhost:5173}   # 메일 속 확인 링크의 웹 주소
  mail:
    from: ${MAIL_FROM:no-reply@bojohelp.local}
  outbox:
    enabled: true
  sms:
    provider: console          # 개발 전용(문자 대신 로그). 운영은 application-prod.yml 에서 실제 대행사를 지정
  auth:
    # 개발 기본값(운영 프로파일은 기본값 없이 환경변수만 허용)
    otp-channel: ${OTP_CHANNEL:email}   # email: 인증번호를 메일로(개발은 Mailpit http://localhost:8025) | sms: 문자(개발은 서버 로그)
    jwt-secret: ${JWT_SIGNING_KEY:dev-only-insecure-jwt-key-change-me-0123456789}
    hmac-pepper: ${HMAC_PEPPER:dev-only-insecure-pepper-0123456789}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5000}   # 개발 기본(웹 5173, 앱 웹 5000). 운영은 application-prod.yml 이 환경변수만 허용
  crypto:
    active-version: 1
    keys:
      1: ${FIELD_ENCRYPTION_KEY_V1:ZGV2LW9ubHktaW5zZWN1cmUtZmllbGQta2V5LTMyYnk=}   # 개발 전용(운영은 기본값 없음)
server:
  shutdown: graceful
  forward-headers-strategy: framework   # Cloudflare/Caddy 뒤
  error:
    include-message: never
    include-stacktrace: never
management:
  health:
    mail:
      enabled: false          # 메일 서버 장애가 서비스 상태(health)를 내리지 않게
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN     # SQL 파라미터에 개인정보가 섞일 수 있어 기본 끔
