spring:
  application:
    name: bojohelp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}      # 운영은 application-prod.yml 이 기본값 없이 덮어써 누락 시 기동 실패
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none          # 스키마는 Flyway 만 바꾼다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
app:
  sms:
    provider: console          # 개발 전용(문자 대신 로그). 운영은 application-prod.yml 에서 실제 대행사를 지정
  auth:
    # 개발 기본값(운영 프로파일은 기본값 없이 환경변수만 허용)
    jwt-secret: ${JWT_SIGNING_KEY:dev-only-insecure-jwt-key-change-me-0123456789}
    hmac-pepper: ${HMAC_PEPPER:dev-only-insecure-pepper-0123456789}
server:
  shutdown: graceful
  forward-headers-strategy: framework   # Cloudflare/Caddy 뒤
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN     # SQL 파라미터에 개인정보가 섞일 수 있어 기본 끔
