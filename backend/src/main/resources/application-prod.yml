# 운영: 값은 전부 환경변수(.env.prod). 기본값을 두지 않아 누락 시 기동 실패.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
app:
  web-base-url: ${WEB_BASE_URL}
  mail:
    from: ${MAIL_FROM}
  sms:
    provider: ${SMS_PROVIDER:none}   # none = 문자 미연결(요청은 완료되지만 보내지 않음). 대행사 구현을 추가하면 값을 바꾼다
  auth:
    otp-channel: ${OTP_CHANNEL:email}   # email = 이메일 코드 가입·로그인(무료에 가까움) | sms = 문자(대행사·건당 비용)
    jwt-secret: ${JWT_SIGNING_KEY}
    hmac-pepper: ${HMAC_PEPPER}
  crypto:
    active-version: ${FIELD_ENCRYPTION_ACTIVE_VERSION}
    keys:
      1: ${FIELD_ENCRYPTION_KEY_V1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}   # 예: https://company.example.com (기본값 없음)
springdoc:
  api-docs:
    enabled: false       # 운영에서 API 문서 비공개
  swagger-ui:
    enabled: false
