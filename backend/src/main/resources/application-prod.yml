# 운영: 값은 전부 환경변수(.env.prod). 기본값을 두지 않아 누락 시 기동 실패.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
app:
  web-base-url: ${WEB_BASE_URL}
  mail:
    from: ${MAIL_FROM}
  sms:
    provider: ${SMS_PROVIDER}   # 실제 문자 대행사 구현을 추가하기 전에는 운영 기동 불가(의도된 안전장치)
  auth:
    jwt-secret: ${JWT_SIGNING_KEY}
    hmac-pepper: ${HMAC_PEPPER}
  crypto:
    active-version: ${FIELD_ENCRYPTION_ACTIVE_VERSION}
    keys:
      1: ${FIELD_ENCRYPTION_KEY_V1}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}   # 예: https://company.example.com (기본값 없음)
springdoc:
  api-docs:
    enabled: false       # 운영에서 API 문서 비공개
  swagger-ui:
    enabled: false
