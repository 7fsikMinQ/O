version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /web
    schedule: {interval: weekly}
  - package-ecosystem: pub
    directory: /app
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
