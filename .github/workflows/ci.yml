name: ci
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  docs-and-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env: {PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client postgresql-contrib
      - run: echo "/usr/lib/postgresql/16/bin" >> $GITHUB_PATH
      - run: tools/sync_migration.sh --check
      - run: tools/verify_all.sh
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "25"}
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --no-daemon test      # Testcontainers: ubuntu-latest 에 Docker 포함
  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  app:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: app}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, flutter-version: "3.47.8"}
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env: {GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
